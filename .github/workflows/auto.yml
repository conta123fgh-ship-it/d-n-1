name: AI Tu Dong
on:
  schedule:
    - cron: '0 1 * * *' # Tự chạy lúc 8:00 sáng mỗi ngày (giờ VN)
  workflow_dispatch:     # Cho phép bấm nút chạy ngay lập tức

permissions:
  contents: write

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chạy AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Lưu kết quả
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "AI Bot"
          git add ket-qua.md
          git commit -m "Cap nhat ket qua AI" || exit 0
          git push
